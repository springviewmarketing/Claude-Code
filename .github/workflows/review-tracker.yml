name: Weekly review tracker

on:
  schedule:
    # 07:00 UTC every Monday, so the reports are waiting first thing.
    # That is 08:00 in British Summer Time and 07:00 in winter.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      send_emails:
        description: 'Also email the clients directly. Normally left off: the drafts are written either way, and sent by hand.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: review-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      outbox: ${{ steps.outbox.outputs.emails }}
      count: ${{ steps.outbox.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read every profile and build the reports
        working-directory: review-tracker
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        # Keep going on a partial failure: a week's reading for the profiles
        # that did answer is worth more than no reading at all, and the report
        # names the ones that did not.
        continue-on-error: true
        run: node src/cli.js weekly

      # Nothing is ever mailed automatically. The Monday run writes the drafts
      # and stops; they go out by hand, after a person has read them. Ticking
      # "Send emails" on a manual run is the only way anything leaves here.
      - name: Work out what to send
        id: outbox
        if: inputs.send_emails
        run: |
          node -e '
            const fs = require("node:fs");
            let all = [];
            try { all = JSON.parse(fs.readFileSync("docs/outbox.json", "utf8")); } catch {}
            const ready = all.filter((e) => e.to && e.subject);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "emails=" + JSON.stringify(ready) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "count=" + ready.length + "\n");
            console.log(`${ready.length} of ${all.length} reports have a contact address.`);
          '

      - name: Commit this week's reading
        run: |
          git config user.name  "review-tracker"
          git config user.email "review-tracker@users.noreply.github.com"
          git add review-tracker/data review-tracker/reports docs
          if git diff --staged --quiet; then
            echo "Nothing changed this week."
            exit 0
          fi
          git commit -m "Weekly review reading, $(date -u '+%d %b %Y') [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed, retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
          done
          exit 1

      - name: Publish the reports as a downloadable bundle
        uses: actions/upload-artifact@v4
        with:
          name: review-reports
          path: review-tracker/reports
          retention-days: 90

  # One job per client, so one bad address cannot stop the rest going out.
  email:
    needs: run
    if: needs.run.outputs.count && needs.run.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.run.outputs.outbox) }}
    steps:
      - name: Send the weekly email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.MAIL_FROM_NAME }} <${{ secrets.MAIL_FROM }}>
          to: ${{ matrix.client.to }}
          reply_to: ${{ secrets.MAIL_FROM }}
          subject: ${{ matrix.client.subject }}
          body: ${{ matrix.client.text }}
          html_body: ${{ matrix.client.html }}
