name: Find place IDs

# Setting a practice up needs its Google place ID. This runs the lookup in the
# Actions tab so the tracker can be configured without installing anything.
#
# Actions tab, "Find place IDs", "Run workflow", type the search, read the log.

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'What to search for, e.g. "opticians in Hillsborough Sheffield"'
        required: true
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The search text reaches the shell through the environment, never spliced
      # into the command line. Interpolating ${{ inputs.* }} directly into a run
      # block lets whoever types the input run arbitrary commands on the runner.
      - name: Search
        id: search
        working-directory: review-tracker
        continue-on-error: true
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          QUERY: ${{ inputs.query }}
        run: node src/cli.js discover "$QUERY" | tee results.txt

      - name: Put the results in the run summary
        if: always()
        working-directory: review-tracker
        env:
          QUERY: ${{ inputs.query }}
        run: |
          {
            printf '## Results for: %s\n\n' "$QUERY"
            echo 'Copy the placeId lines into review-tracker/config/practices.json'
            echo ''
            echo '```'
            cat results.txt 2>/dev/null || echo 'The search failed. Check the Search step above for the reason.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if the search failed
        if: steps.search.outcome == 'failure'
        run: exit 1
